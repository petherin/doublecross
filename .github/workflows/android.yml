name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and Android export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Install Godot and Android export templates
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/android_debug.apk" ]; then
            mkdir -p "$T"
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
            unzip -q -j -o /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d "$T"
            rm /tmp/templates.tpz
          fi
          ls "$T"

      - name: Point Godot at the Android SDK, Java and debug key
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Export APK
        run: |
          mkdir -p build
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-debug "Android" build/double-cross.apk
          test -f build/double-cross.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: double-cross-apk
          path: build/double-cross.apk
