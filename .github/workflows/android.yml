name: Build Android APK and Mac app

# Every push to main (including merged pull requests) that changes the game
# builds both apps and publishes them as a GitHub Release, which anyone can
# download without a GitHub account. Pull requests just build.

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to publish releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-macos

      - name: Install Godot and the Android + macOS export templates
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
            unzip -q /tmp/godot.zip -d ~/godot
            mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ ! -f "$T/android_debug.apk" ] || [ ! -f "$T/macos.zip" ]; then
            mkdir -p "$T"
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
            unzip -q -j -o /tmp/templates.tpz 'templates/android_*' 'templates/macos.zip' 'templates/version.txt' -d "$T"
            rm /tmp/templates.tpz
          fi
          ls "$T"

      - name: Point Godot at the Android SDK, Java and debug key
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Stamp the version number
        # Each build gets a higher version so the APK installs over the last one.
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.${{ github.run_number }}\"/" export_presets.cfg
          sed -i "s/^application\/short_version=.*/application\/short_version=\"0.${{ github.run_number }}\"/" export_presets.cfg
          sed -i "s/^application\/version=.*/application\/version=\"${{ github.run_number }}\"/" export_presets.cfg
          grep -E "^(version/|application/(short_)?version)" export_presets.cfg

      - name: Export APK
        # A release build (smaller engine), signed with the shared debug key so
        # each new APK still installs over the previous one.
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-release "Android" build/double-cross.apk
          test -f build/double-cross.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: double-cross-apk
          path: build/double-cross.apk

      - name: Export Mac app
        run: |
          ~/godot/godot --headless --export-release "macOS" build/DoubleCross-macOS.zip
          test -f build/DoubleCross-macOS.zip
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: double-cross-mac
          # Godot's zip keeps the app's executable permissions; GitHub's own
          # artifact zipping would not, so upload the zip as-is.
          path: build/DoubleCross-macOS.zip

      - name: Publish a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TAG="v0.${{ github.run_number }}"
          cp build/double-cross.apk build/DoubleCross.apk
          {
            echo "## What's new"
            echo
            echo "$COMMIT_MESSAGE" | grep -v -E "^(Co-Authored-By|Claude-Session):"
            echo
            echo "## Download"
            echo
            echo "- **Android (phones and tablets):** \`DoubleCross.apk\`. Open it on the device and allow installs from that source the first time."
            echo "- **Mac (Apple Silicon and Intel):** \`DoubleCross-macOS.zip\`. Unzip, move *Double Cross.app* to Applications, then see the README for getting past macOS's unidentified-developer warning."
          } > notes.md
          gh release create "$TAG" build/DoubleCross.apk build/DoubleCross-macOS.zip \
            --title "Double Cross $TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
